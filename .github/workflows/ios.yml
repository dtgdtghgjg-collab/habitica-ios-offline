name: iOS CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install iOS Simulator Runtime
        run: |
          sudo xcodebuild -downloadPlatform iOS

      # The app links Habitica_Models, Habitica_Database and Habitica_API_Client,
      # which are separate projects joined only by Habitica.xcworkspace, so the
      # build must go through -workspace (not -project).
      - name: Build Habitica
        run: |
          xcodebuild \
            -workspace Habitica.xcworkspace \
            -scheme Habitica \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build