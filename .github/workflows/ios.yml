name: iOS CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # The build log is not downloadable without admin rights, so on failure the
  # compiler errors are published as an issue, where the public API can read
  # them back without a token.
  issues: write
  # Uploading the .ipa artifact.
  actions: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The app uses iOS 26 APIs under #available(iOS 26.0, *), so it must be
      # compiled against the Xcode 26 SDK. Try the newest Xcode 26.x present on
      # the runner first, then fall back through older 26.x releases.
      - name: Select Xcode 26
        run: |
          for ver in 26.6 26.5 26.4 26.3 26.2 26.1.1 26.1; do
            if [ -d "/Applications/Xcode_${ver}.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_${ver}.app/Contents/Developer"
              exit 0
            fi
          done
          echo "No Xcode 26.x found; available:" >&2
          ls -1 /Applications | grep -i xcode >&2
          exit 1

      - name: Show Xcode version
        run: xcodebuild -version

      # The app links Habitica_Models, Habitica_Database and Habitica_API_Client,
      # which are separate projects joined only by Habitica.xcworkspace, so the
      # build must go through -workspace (not -project).
      - name: Build Habitica
        id: build
        run: |
          set +e
          xcodebuild \
            -workspace Habitica.xcworkspace \
            -scheme Habitica \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -n 40 build.log

      - name: Publish build errors
        if: steps.build.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f build.log ]; then
            echo "build.log missing" >&2
            exit 0
          fi
          {
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Exit code: ${{ steps.build.outputs.exit_code }}"
            echo
            echo '```'
            grep -E "(^|[^a-zA-Z])error: " build.log \
              | sed -E 's#^/Users/runner/work/[^ ]*/##' \
              | head -n 300 || true
            echo '```'
          } > errors.txt
          cat errors.txt >> "$GITHUB_STEP_SUMMARY"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" \
            -f title="CI build errors (run ${GITHUB_RUN_ID})" \
            -F body=@errors.txt || echo "could not publish issue" >&2

      # The app is built for the simulator, so this .ipa is a simulator bundle.
      # It runs in Simulator.app / on a simulator via `xcrun simctl install`, but
      # it is unsigned and therefore cannot be installed on a physical device.
      - name: Package .app into .ipa
        if: steps.build.outputs.exit_code == '0'
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -maxdepth 2 -name "Habitica.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Habitica.app not found under build/DerivedData/Build/Products" >&2
            ls -R build/DerivedData/Build/Products | head -n 50 >&2
            exit 1
          fi
          echo "Packaging $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qry Habitica.ipa Payload
          rm -rf Payload
          ls -lh Habitica.ipa

      - name: Upload IPA
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Habitica-ipa
          path: Habitica.ipa
          if-no-files-found: error

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
